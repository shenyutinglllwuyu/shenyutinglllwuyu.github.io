
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERROR-未知错误</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 定义CSS变量，保持与主站一致的主题系统 */
        :root {
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #c3cfe2;
            --primary-color: #3b82f6;
            --text-main: #1f2937;
            --text-secondary: #4b5563;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --error-color: #ef4444;
        }

        /* 深色主题变量 */
        [data-theme="dark"] {
            --bg-gradient-start: #1a1c23;
            --bg-gradient-end: #4a4e69;
            --primary-color: #60a5fa;
            --text-main: #f3f4f6;
            --text-secondary: #d1d5db;
            --glass-bg: rgba(31, 41, 55, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --error-color: #f87171;
        }

        /* 暖色主题变量 */
        [data-theme="warm"] {
            --bg-gradient-start: #fff1eb;
            --bg-gradient-end: #ace0f9;
            --primary-color: #f59e0b;
            --text-main: #78350f;
            --text-secondary: #92400e;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.6);
            --error-color: #dc2626;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            transition: background 0.5s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-effect {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .theme-btn {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .theme-btn:hover {
            transform: scale(1.1);
        }
        .theme-btn.active {
            ring: 2px solid var(--primary-color);
            transform: scale(1.15);
        }

        /* 错误图标动画 */
        .shake-anim {
            animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both infinite;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .gear-spin {
            animation: spin 4s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="py-10 px-4 relative">

    <!-- 主题切换控制面板 (与首页保持一致) -->
    <div class="fixed top-6 right-6 z-50 glass-effect rounded-full p-2 shadow-lg flex gap-3">
        <button onclick="setTheme('light')" class="theme-btn w-8 h-8 rounded-full bg-gradient-to-br from-gray-100 to-gray-300 border border-gray-200" title="浅色模式" aria-label="切换到浅色模式"></button>
        <button onclick="setTheme('dark')" class="theme-btn w-8 h-8 rounded-full bg-gradient-to-br from-gray-800 to-gray-900 border border-gray-700" title="深色模式" aria-label="切换到深色模式"></button>
        <button onclick="setTheme('warm')" class="theme-btn w-8 h-8 rounded-full bg-gradient-to-br from-orange-100 to-blue-100 border border-orange-200" title="暖色模式" aria-label="切换到暖色模式"></button>
    </div>

    <!-- 主要内容区域 -->
    <main class="w-full max-w-2xl glass-effect rounded-3xl p-10 shadow-2xl text-center relative overflow-hidden">
        <!-- 装饰背景元素：齿轮 -->
        <div class="absolute top-0 left-0 w-full h-full opacity-5 pointer-events-none overflow-hidden">
            <i class="fas fa-cog absolute top-[-50px] left-[-50px] text-[200px] gear-spin" style="color: var(--text-main)"></i>
            <i class="fas fa-cog absolute bottom-[-80px] right-[-80px] text-[250px] gear-spin" style="color: var(--text-main); animation-direction: reverse;"></i>
        </div>

        <!-- 500 大字展示 -->
        <div class="mb-6 relative z-10">
            <div class="inline-block p-6 rounded-full bg-red-50 dark:bg-red-900/20 mb-4 shake-anim">
                <i class="fas fa-server text-6xl" style="color: var(--error-color)"></i>
            </div>
            <h1 class="text-8xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-orange-500 drop-shadow-lg" style="font-family: 'Arial Black', sans-serif;">
                未知错误
            </h1>
        </div>

        <!-- 提示信息 -->
        <h2 class="text-3xl font-bold mb-4" style="color: var(--text-main)">服务器开小差了</h2>
        <p class="text-lg mb-8 max-w-md mx-auto" style="color: var(--text-secondary)">
            抱歉，服务器遇到了一些意外情况，暂时无法处理您的请求。
        </p>

        <!-- 操作按钮 -->
        <div class="flex flex-col sm:flex-row justify-center gap-4 relative z-10">
            <a href="/index.html" class="px-8 py-3 rounded-full font-bold text-white shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-2" style="background-color: var(--primary-color)">
                <i class="fas fa-home"></i> 返回首页
            </a>
            <button onclick="window.location.reload()" class="px-8 py-3 rounded-full font-bold glass-effect hover:bg-white/50 transition-all duration-300 flex items-center justify-center gap-2" style="color: var(--text-main)">
                <i class="fas fa-sync-alt"></i> 刷新页面
            </button>
        </div>

        <!-- 技术支持信息 -->
        <div class="mt-10 pt-6 border-t relative z-10" style="border-color: var(--glass-border)">
            <p class="text-xs opacity-60" style="color: var(--text-secondary)">请联系网站管理员(邮箱:shenyutinglllwuyu@163.com)</p>
        </div>
    </main>

    <!-- 底部版权 -->
    <footer class="fixed bottom-4 w-full text-center text-sm py-2" style="color: var(--text-secondary)">
        <p>Copyright &copy; 2026 shenyutinglllwuyu. All Rights Reserved. 
</p>
    </footer>

    <script>
        // 主题切换逻辑 (与首页完全一致)
        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('theme', themeName);
            updateActiveButton(themeName);
        }

        function updateActiveButton(themeName) {
            const buttons = document.querySelectorAll('.theme-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('onclick').includes(themeName)) {
                    btn.classList.add('active');
                }
            });
        }

        // 初始化主题
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
        })();
    </script>
</body>
</html>
