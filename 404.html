
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 -页面未找到</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 定义CSS变量，保持与主站一致的主题系统 */
        :root {
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #c3cfe2;
            --primary-color: #3b82f6;
            --text-main: #1f2937;
            --text-secondary: #4b5563;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        /* 深色主题变量 */
        [data-theme="dark"] {
            --bg-gradient-start: #1a1c23;
            --bg-gradient-end: #4a4e69;
            --primary-color: #60a5fa;
            --text-main: #f3f4f6;
            --text-secondary: #d1d5db;
            --glass-bg: rgba(31, 41, 55, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        /* 暖色主题变量 */
        [data-theme="warm"] {
            --bg-gradient-start: #fff1eb;
            --bg-gradient-end: #ace0f9;
            --primary-color: #f59e0b;
            --text-main: #78350f;
            --text-secondary: #92400e;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            transition: background 0.5s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-effect {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .theme-btn {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .theme-btn:hover {
            transform: scale(1.1);
        }
        .theme-btn.active {
            ring: 2px solid var(--primary-color);
            transform: scale(1.15);
        }

        /* 404 动画效果 */
        .float-anim {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .pulse-anim {
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body class="py-10 px-4 relative">

    <!-- 主题切换控制面板 (与首页保持一致) -->
    <div class="fixed top-6 right-6 z-50 glass-effect rounded-full p-2 shadow-lg flex gap-3">
        <button onclick="setTheme('light')" class="theme-btn w-8 h-8 rounded-full bg-gradient-to-br from-gray-100 to-gray-300 border border-gray-200" title="浅色模式" aria-label="切换到浅色模式"></button>
        <button onclick="setTheme('dark')" class="theme-btn w-8 h-8 rounded-full bg-gradient-to-br from-gray-800 to-gray-900 border border-gray-700" title="深色模式" aria-label="切换到深色模式"></button>
        <button onclick="setTheme('warm')" class="theme-btn w-8 h-8 rounded-full bg-gradient-to-br from-orange-100 to-blue-100 border border-orange-200" title="暖色模式" aria-label="切换到暖色模式"></button>
    </div>

    <!-- 主要内容区域 -->
    <main class="w-full max-w-2xl glass-effect rounded-3xl p-10 shadow-2xl text-center relative overflow-hidden">
        <!-- 装饰背景元素 -->
        <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
            <i class="fas fa-question absolute top-10 left-10 text-6xl"></i>
            <i class="fas fa-exclamation absolute bottom-10 right-10 text-6xl"></i>
        </div>

        <!-- 404 大字展示 -->
        <div class="mb-6 float-anim">
            <h1 class="text-9xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-500 to-pink-500 drop-shadow-lg" style="font-family: 'Arial Black', sans-serif;">
                404
            </h1>
        </div>

        <!-- 提示信息 -->
        <h2 class="text-3xl font-bold mb-4" style="color: var(--text-main)">哎呀！页面迷路了</h2>
        <p class="text-lg mb-8 max-w-md mx-auto" style="color: var(--text-secondary)">
            你访问的页面可能已经被移除、更名或者暂时不可用。别担心，我们可以带你回到熟悉的地方。
        </p>

        <!-- 操作按钮 -->
        <div class="flex flex-col sm:flex-row justify-center gap-4">
            <a href="/index.html" class="px-8 py-3 rounded-full font-bold text-white shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-2" style="background-color: var(--primary-color)">
                <i class="fas fa-home"></i> 返回首页
            </a>
            <button onclick="window.history.back()" class="px-8 py-3 rounded-full font-bold glass-effect hover:bg-white/50 transition-all duration-300 flex items-center justify-center gap-2" style="color: var(--text-main)">
                <i class="fas fa-arrow-left"></i> 返回上一页
            </button>
        </div>
    </main>

    <!-- 底部版权 -->
    <footer class="fixed bottom-4 w-full text-center text-sm py-2" style="color: var(--text-secondary)">
        <p>Copyright &copy; 2026 shenyutinglllwuyu. All Rights Reserved. 
</p>
    </footer>

    <script>
        // 主题切换逻辑 (与首页完全一致)
        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('theme', themeName);
            updateActiveButton(themeName);
        }

        function updateActiveButton(themeName) {
            const buttons = document.querySelectorAll('.theme-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('onclick').includes(themeName)) {
                    btn.classList.add('active');
                }
            });
        }

        // 初始化主题
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
        })();
    </script>
</body>
</html>
