
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能调试中</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 定义CSS变量，保持与主站一致的主题系统 */
        :root {
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #c3cfe2;
            --primary-color: #3b82f6;
            --text-main: #1f2937;
            --text-secondary: #4b5563;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --warning-color: #f59e0b;
        }

        /* 深色主题变量 */
        [data-theme="dark"] {
            --bg-gradient-start: #1a1c23;
            --bg-gradient-end: #4a4e69;
            --primary-color: #60a5fa;
            --text-main: #f3f4f6;
            --text-secondary: #d1d5db;
            --glass-bg: rgba(31, 41, 55, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --warning-color: #fbbf24;
        }

        /* 暖色主题变量 */
        [data-theme="warm"] {
            --bg-gradient-start: #fff1eb;
            --bg-gradient-end: #ace0f9;
            --primary-color: #f59e0b;
            --text-main: #78350f;
            --text-secondary: #92400e;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.6);
            --warning-color: #d97706;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            transition: background 0.5s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-effect {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .theme-btn {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .theme-btn:hover {
            transform: scale(1.1);
        }
        .theme-btn.active {
            ring: 2px solid var(--primary-color);
            transform: scale(1.15);
        }

        /* 施工图标动画 */
        .construction-anim {
            animation: swing 3s ease-in-out infinite;
            transform-origin: top center;
        }
        @keyframes swing {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(15deg); }
            40% { transform: rotate(-10deg); }
            60% { transform: rotate(5deg); }
            80% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }

        .blink-anim {
            animation: blink 2s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="py-10 px-4 relative">

    <!-- 主要内容区域 -->
    <main class="w-full max-w-2xl glass-effect rounded-3xl p-10 shadow-2xl text-center relative overflow-hidden">
        <!-- 装饰背景元素：警示带纹理 -->
        <div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: repeating-linear-gradient(45deg, var(--text-main) 0, var(--text-main) 10px, transparent 10px, transparent 20px);"></div>

        <!-- 施工中图标展示 -->
        <div class="mb-6 relative z-10 construction-anim">
            <div class="inline-block p-6 rounded-full bg-yellow-50 dark:bg-yellow-900/20 mb-4">
                <i class="fas fa-hard-hat text-6xl" style="color: var(--warning-color)"></i>
            </div>
        </div>

        <!-- 标题与状态 -->
        <h1 class="text-4xl font-bold mb-2" style="color: var(--text-main)">暂停维护</h1>
        <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full text-sm font-medium mb-6 blink-anim" style="background-color: rgba(245, 158, 11, 0.1); color: var(--warning-color); border: 1px solid var(--warning-color);">
            <i class="fas fa-tools"></i> 该页面已暂停维护
        </div>

        <!-- 提示信息 -->
        <p class="text-lg mb-8 max-w-md mx-auto" style="color: var(--text-secondary)">
            该页面加载异常会导致页面无响应，已拦截访问。<br>您也可以选择继续访问。
        </p>

        <!-- 操作按钮 -->
        <div class="flex flex-col sm:flex-row justify-center gap-4 relative z-10">
            <a href="index.html" class="px-8 py-3 rounded-full font-bold text-white shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-2" style="background-color: var(--primary-color)">
                <i class="fas fa-home"></i> 返回首页
            </a>
            <button onclick="window.history.back()" class="px-8 py-3 rounded-full font-bold glass-effect hover:bg-white/50 transition-all duration-300 flex items-center justify-center gap-2" style="color: var(--text-main)">
                <i class="fas fa-arrow-left"></i> 返回上一页
            </button>
            <a href="music163wanggeM3Auto.html" class="px-8 py-3 rounded-full font-bold glass-effect hover:bg-white/50 transition-all duration-300 flex items-center justify-center gap-2" style="color: #8B0000; border: 2px solid #8B0000;">
                <i class="fas fa-arrow-right"></i> 继续访问
            </a>
        </div>
    </main>

    <!-- 底部版权 -->
    <footer class="fixed bottom-4 w-full text-center text-sm py-2" style="color: var(--text-secondary)">
        <p>Copyright &copy; 2026 shenyutinglllwuyu. All Rights Reserved. </p>
    </footer>

    <script>
        // 主题切换逻辑 (与首页完全一致)
        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('theme', themeName);
            updateActiveButton(themeName);
        }

        function updateActiveButton(themeName) {
            const buttons = document.querySelectorAll('.theme-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('onclick').includes(themeName)) {
                    btn.classList.add('active');
                }
            });
        }

        // 初始化主题
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
        })();
    </script>
</body>
</html>
