<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* 玻璃拟态背景 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* 唱片旋转动画 */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin-disc {
            animation: rotate 20s linear infinite;
            transition: animation-play-state 0.3s ease;
        }
        .paused-disc {
            animation-play-state: paused;
        }

        /* 进度条样式 - 完全接管外观不受Tailwind默认类影响 */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -4px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        
        /* 仅核心展示元素添加文字高光，避免全局文字模糊 */
        .title-glow {
            text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255,255,255,0.3);
        }

        /* 移动端底部安全区域适配 */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden relative font-sans selection:bg-pink-500 selection:text-white">

    <!-- 动态背景层 - 增加初始默认渐变兜底避免空白报错 -->
    <div id="bg-layer" class="absolute inset-0 z-0 bg-cover bg-center transition-all duration-1000 ease-in-out" 
         style="background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%); filter: blur(20px) brightness(0.6); transform: scale(1.1);">
    </div>

    <!-- 主容器 -->
    <div class="relative z-10 h-full flex flex-col md:flex-row p-4 md:p-8 gap-6 max-w-7xl mx-auto">
        
        <!-- 左侧：播放器核心区域 -->
        <div class="flex-1 glass-panel rounded-3xl p-6 flex flex-col justify-between shadow-2xl relative overflow-hidden">
            <div class="absolute top-4 left-0 right-0 flex justify-center z-20 pointer-events-none">
                <!-- 使用 pointer-events-auto 恢复按钮点击 -->
                <a href="/index.html" id="home-btn" class="pointer-events-auto group flex items-center justify-center px-3 py-2 rounded-full bg-white/20 hover:bg-white/30 backdrop-blur-md text-white transition transform hover:scale-105 shadow-lg border border-white/10" title="返回主页">
                <i class="fas fa-home text-sm md:text-base"></i>
                <span class="hidden md:inline-block ml-2 text-sm font-medium tracking-wide">返回主页</span>
            </a>
        </div>
            <!-- 顶部标题 -->
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center">
                    <i class="fas fa-music mr-2 text-xl title-glow"></i>
                    <h2 class="hidden md:block text-xl font-bold tracking-wider title-glow">正在播放</h2>
                </div>
    
    <button id="toggle-list-btn" class="text-lg font-bold md:hidden title-glow">
        <i class="fas fa-list-ul mr-2"></i>
        <span>播放列表</span>
    </button>
</div>

            <!-- 唱片与封面 -->
            <div class="flex-1 flex items-center justify-center py-4 relative group">
                <div class="relative w-64 h-64 md:w-80 md:h-80 rounded-full shadow-2xl border-4 border-white/10 spin-disc paused-disc" id="disc-container">
                    <!-- 封面图增加默认兜底图，避免初始空白报错 -->
                    <img id="current-cover" src="https://picsum.photos/800/800" alt="专辑封面" 
                         class="w-full h-full object-cover rounded-full opacity-90">
                    <!-- 中心孔 -->
                    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-16 h-16 bg-gray-900 rounded-full border-2 border-white/20 flex items-center justify-center">
                        <div class="w-4 h-4 bg-white rounded-full"></div>
                    </div>
                </div>
                <!-- 光效装饰 -->
                <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-pink-500/20 to-purple-500/20 blur-xl -z-10 group-hover:blur-2xl transition-all duration-500"></div>
            </div>

            <!-- 歌曲信息 -->
            <div class="text-center mb-6">
                <h1 id="track-title" class="text-2xl md:text-3xl font-bold mb-2 truncate title-glow">加载中...</h1>
                <p id="track-artist" class="text-white text-lg title-glow">NowLoading...</p>
            </div>

            <!-- 进度条 - 删除冲突的bg-gray-600类，完全交由自定义CSS控制样式 -->
            <div class="mb-6 px-2">
                <div class="flex justify-between text-xs text-white mb-1 font-mono">
                    <span id="current-time">00:00</span>
                    <span id="duration">00:00</span>
                </div>
                <input type="range" id="progress-bar" value="0" min="0" max="100" class="w-full appearance-none cursor-pointer">
            </div>

            <!-- 控制按钮 -->
            <div class="flex justify-center items-center gap-8 mb-4">
                <button id="prev-btn" class="text-2xl text-gray-300 hover:text-white hover:scale-110 transition transform">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button id="play-btn" class="w-16 h-16 rounded-full bg-white text-gray-900 flex items-center justify-center text-2xl shadow-lg hover:scale-105 hover:bg-pink-100 transition transform">
                    <i class="fas fa-play ml-1"></i>
                </button>
                <button id="next-btn" class="text-2xl text-gray-300 hover:text-white hover:scale-110 transition transform">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>
            
            <!-- 音量控制 - 删除冲突的bg-gray-600类 -->
            <div class="flex items-center justify-center gap-3 px-4">
                <i class="fas fa-volume-down text-gray-400 text-sm"></i>
                <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1.0" class="w-24 appearance-none cursor-pointer">
                <i class="fas fa-volume-up text-gray-400 text-sm"></i>
            </div>
        </div>

        <!-- 右侧：播放列表 (移动端默认隐藏，通过JS切换) 追加pb-safe适配底部安全区 -->
        <div id="playlist-panel" class="hidden md:flex flex-col w-full md:w-96 glass-panel rounded-3xl p-6 shadow-2xl overflow-hidden transition-all duration-300 pb-safe">
            <!-- 添加返回按钮 -->
            <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-4">
                <button id="back-to-player-btn" class="md:hidden text-white hover:text-pink-400 transition flex items-center">
                    <i class="fas fa-arrow-left mr-2"></i>
                    <span>返回播放器</span>
                </button>
                <h3 class="text-lg font-bold hidden md:block title-glow"><i class="fas fa-list-ul mr-2"></i>播放列表</h3>
                <span id="track-count" class="text-xs bg-white/20 px-2 py-1 rounded-full">0 首</span>
            </div>
            
            <!-- 列表容器 -->
            <div id="playlist-container" class="flex-1 overflow-y-auto pr-2 space-y-2">
                <!-- 列表项将通过 JS 动态生成 -->
                <div class="text-center text-gray-400 mt-10">
                    <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                    <p>加载歌单中...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 音频元素 (核心：preload="none" 配合 JS 实现流式加载，内置错误监听兜底) -->
    <audio id="audio-player" preload="none"></audio>
    <script>
        const audioPlayer = document.getElementById('audio-player');
        audioPlayer.addEventListener('error', () => {
            alert('当前音频加载失败，请检查网络或音频链接有效性');
        });
    </script>

    <script src="../javascript/app.js"></script>
    <script>
        // 移动端播放列表切换修复
        document.addEventListener('DOMContentLoaded', function() {
            const toggleListBtn = document.getElementById('toggle-list-btn');
            const playlistPanel = document.getElementById('playlist-panel');
            const backToPlayerBtn = document.getElementById('back-to-player-btn');
            
            // 显示播放列表（移动端）
            toggleListBtn.addEventListener('click', function() {
                playlistPanel.classList.remove('hidden');
                playlistPanel.classList.add('flex', 'absolute', 'inset-0', 'z-50', 'bg-gray-900/95');
            });
            
            // 返回播放器（移动端）
            backToPlayerBtn.addEventListener('click', function() {
                playlistPanel.classList.remove('flex', 'absolute', 'inset-0', 'z-50', 'bg-gray-900/95');
                playlistPanel.classList.add('hidden');
            });
            
            // 修复点击列表面板内部选歌时误关面板的冒泡问题
            playlistPanel.addEventListener('click', function(e) {
                if (e.target !== playlistPanel) {
                    // 点击的是列表内部元素，不触发关闭逻辑
                    return;
                }
                playlistPanel.classList.remove('flex', 'absolute', 'inset-0', 'z-50', 'bg-gray-900/95');
                playlistPanel.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
