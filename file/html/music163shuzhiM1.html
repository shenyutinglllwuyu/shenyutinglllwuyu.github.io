<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐推荐</title>
    <!-- Favicon -->
    <link rel="icon" href="/file/web/favicon.ico" type="image/icon">
    <link rel="shortcut icon" href="/file/web/favicon.ico" type="image/icon">
    <link rel="apple-touch-icon" href="/file/web/favicon.ico">

    <!-- 依赖库 -->
    <script src="/file/3.4.17.txt"></script>
    <link rel="stylesheet" href="/file/fontawesome-free-6.4.0-web/css/all.min.css">
    
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        .netease-player {
            width: 100%;
            height: 86px;
            border: none;
            display: block;
        }
        /* 大卡片样式 */
        .big-card {
            background: rgba(31, 31, 31, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            padding: 2rem;
            min-height: auto;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
            overflow-x: visible; 
            overflow-y: hidden;
        }
        /* 卡片加载前的占位背景 */
        .card-skeleton {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #1f1f1f 25%, #2a2a2a 50%, #1f1f1f 75%);
            background-size: 200% 100%;
            animation: loading-shimmer 1.5s infinite;
            border-radius: 1.5rem;
            z-index: 0;
        }
        @keyframes loading-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .card-content {
            position: relative;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .card-content.loaded {
            opacity: 1;
        }
        /* 分页容器样式 */
        .pagination-container {
            display: flex;
            flex-wrap: nowrap;
            justify-content: flex-start; 
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            min-height: 40px;
            width: 100%;
            box-sizing: border-box;
            padding: 0 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        .pagination-container::-webkit-scrollbar {
            display: none;
        }
        .pagination-container > :first-child {
            margin-left: auto;
        }
        .pagination-container > :last-child {
            margin-right: auto;
        }
        /* 分页按钮样式 - 固定尺寸以确保计算准确 */
        .pagination-btn {
            min-width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            padding: 0 8px;
            user-select: none;
            box-sizing: border-box;
        }
        .pagination-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .pagination-btn.active {
            background: white;
            color: black;
            border-color: white;
            font-weight: bold;
        }
        .pagination-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        /* 省略号样式 */
        .pagination-ellipsis {
            min-width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 0.9rem;
            padding: 0 4px;
            box-sizing: border-box;
        }
        /* 播放器占位符 */
        .player-placeholder {
            width: 100%;
            height: 86px;
            background: #1f1f1f;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        
        /* 移动端微调 */
        @media (max-width: 640px) {
            .big-card {
                padding: 1rem;
                border-radius: 1rem;
            }
            .pagination-btn, .pagination-ellipsis {
                min-width: 32px;
                height: 32px;
                font-size: 0.85rem;
                padding: 0 4px;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="fixed top-0 w-full z-50 bg-black/80 backdrop-blur-md border-b border-white/10">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center px-4 py-2 rounded-full bg-white/10 hover:bg-white/20 text-sm font-medium transition-colors">
                <i class="fas fa-home mr-2"></i> 返回首页
            </a>
            <h1 class="text-lg font-bold tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">
                音乐推荐
            </h1>
        </div>
    </nav>

    <main class="flex-1 pt-24 pb-12 px-4 max-w-4xl mx-auto w-full">
        <div id="music-container" class="space-y-10">
            <!-- 动态内容将通过 JS 从 config.json 加载 -->
            <div class="text-center text-gray-500 py-20">
                <i class="fas fa-circle-notch fa-spin text-3xl mb-4"></i>
                <p>正在加载音乐配置...</p>
            </div>
        </div>
    </main>

    <script>
        const ITEMS_PER_PAGE = 2;
        let cardObserver; 
        let playerObserver; 
        let musicGroups = []; 

        // 初始化页面并加载 JSON
        async function initPage() {
            try {
                const response = await fetch('../json/music163config.json', {
                    cache: 'no-store'
                });
                
                if (!response.ok) throw new Error('无法加载 config.json');
                musicGroups = await response.json();
                
                const container = document.getElementById('music-container');
                container.innerHTML = ''; 

                initObservers();

                if (musicGroups && musicGroups.length > 0) {
                    musicGroups.forEach((group, index) => {
                        createCardSkeleton(index);
                    });
                } else {
                    container.innerHTML = '<div class="text-center text-gray-500">暂无音乐数据</div>';
                }

            } catch (error) {
                console.error(error);
                document.getElementById('music-container').innerHTML = `
                    <div class="text-center text-red-400 py-20">
                        <i class="fas fa-exclamation-triangle text-3xl mb-4"></i>
                        加载失败: ${error.message}</p>
                    </div>
                `;
            }
        }

        function createCardSkeleton(index) {
            const container = document.getElementById('music-container');
            const bigCard = document.createElement('div');
            bigCard.className = "big-card";
            bigCard.setAttribute('data-group-index', index);
            
            const skeleton = document.createElement('div');
            skeleton.className = "card-skeleton";
            bigCard.appendChild(skeleton);

            const contentDiv = document.createElement('div');
            contentDiv.className = "card-content";
            contentDiv.id = `content-${index}`;
            bigCard.appendChild(contentDiv);

            container.appendChild(bigCard);
            
            if (cardObserver) cardObserver.observe(bigCard);
        }

        function initObservers() {
            // 播放器懒加载观察者
            playerObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const placeholder = entry.target;
                        const src = placeholder.getAttribute('data-src');
                        if (src) {
                            const iframe = document.createElement('iframe');
                            iframe.className = 'netease-player rounded-lg';
                            iframe.src = src;
                            iframe.frameBorder = "no";
                            iframe.border = "0";
                            iframe.marginWidth = "0";
                            iframe.marginHeight = "0";
                            iframe.scrolling = "no";
                            iframe.loading = "lazy";
                            placeholder.parentNode.replaceChild(iframe, placeholder);
                        }
                        playerObserver.unobserve(placeholder);
                    }
                });
            }, { rootMargin: '300px' });

            // 卡片懒加载观察者
            cardObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const card = entry.target;
                        const groupIndex = parseInt(card.getAttribute('data-group-index'));
                        
                        if (musicGroups[groupIndex]) {
                            initCardContent(card, musicGroups[groupIndex], groupIndex);
                        }
                        
                        cardObserver.unobserve(card);
                    }
                });
            }, { rootMargin: '300px' });
        }

        function initCardContent(cardElement, group, groupIndex) {
            const contentDiv = document.getElementById(`content-${groupIndex}`);
            const skeleton = cardElement.querySelector('.card-skeleton');
            
            if (!contentDiv) return;

            const headerHtml = `
                <div class="mb-6 text-center">
                    <span class="inline-block px-6 py-2 rounded-full text-sm font-bold text-white shadow-lg" 
                          style="background: linear-gradient(135deg, ${group.color || '#333'}, ${adjustColor(group.color || '#333', 40)})">
                        ${group.label || '音乐列表'}
                    </span>
                </div>
            `;
            
            const gridContainerId = `grid-${groupIndex}`;
            const paginationId = `pagination-${groupIndex}`;
            
            const gridHtml = `<div id="${gridContainerId}" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"></div>`;
            const paginationHtml = `<div class="pagination-container" id="${paginationId}"></div>`;

            contentDiv.innerHTML = headerHtml + gridHtml + paginationHtml;
            
            if (skeleton) skeleton.style.display = 'none';
            contentDiv.classList.add('loaded');

            if (group.ids && group.ids.length > 0) {
                initGroupPagination(groupIndex, group.ids);
            }
        }

        // 辅助函数：调整颜色亮度
        function adjustColor(color, amount) {
            if (!color || color.length !== 7) return '#333333';
            try {
                return '#' + color.replace(/^#/, '').replace(/../g, color => ('0'+Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
            } catch (e) {
                return '#333333';
            }
        }

        function initGroupPagination(groupIndex, ids) {
            const totalPages = Math.ceil(ids.length / ITEMS_PER_PAGE);
            if (totalPages <= 0) return;
            
            let currentPage = 1;
            let resizeTimer;

            const renderPage = (page, isResize = false) => {
                const gridContainer = document.getElementById(`grid-${groupIndex}`);
                const paginationContainer = document.getElementById(`pagination-${groupIndex}`);
                
                if (!gridContainer || !paginationContainer) return;

                try {
                    // 仅在非resize场景下渲染播放器，避免窗口变化导致音乐重载
                    if (!isResize) {
                        gridContainer.innerHTML = '';
                        const start = (page - 1) * ITEMS_PER_PAGE;
                        const end = start + ITEMS_PER_PAGE;
                        const pageIds = ids.slice(start, end);

                        pageIds.forEach(id => {
                            const playerSrc = `https://music.163.com/outchain/player?type=2&id=${id}&auto=0&height=66`;
                            const cardDiv = document.createElement('div');
                            cardDiv.className = "bg-white/5 rounded-xl p-3 border border-white/5";
                            cardDiv.innerHTML = `
                                <div class="player-placeholder" data-src="${playerSrc}">
                                    <div class="text-center text-gray-500">
                                        <i class="fas fa-play-circle text-2xl mb-1"></i>
                                        <div class="text-xs">点击加载</div>
                                    </div>
                                </div>
                            `;
                            gridContainer.appendChild(cardDiv);
                        });
                        
                        // 注册播放器懒加载
                        const placeholders = gridContainer.querySelectorAll('.player-placeholder');
                        placeholders.forEach(el => {
                            if (playerObserver) playerObserver.observe(el);
                        });
                    }

                    // 分页控件渲染逻辑（所有场景均执行，仅更新页码按钮布局）
                    paginationContainer.innerHTML = '';
                    
                    if (totalPages <= 1) return;

                    const isMobile = window.innerWidth < 640;
                    const itemWidth = (isMobile ? 40 : 44) + 10;
                    const safeWidth = paginationContainer.clientWidth || (window.innerWidth - (isMobile ? 32 : 64)); 
                    const availableForPages = safeWidth - (itemWidth * 2);
                    
                    let maxVisible = Math.floor(availableForPages / itemWidth);
                    maxVisible = Math.max(3, Math.min(maxVisible, totalPages));

                    const pageItems = generateSmartPagination(totalPages, page, maxVisible);

                    // 上一页按钮
                    const prevBtn = document.createElement('button');
                    prevBtn.className = 'pagination-btn';
                    prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
                    prevBtn.disabled = page === 1;
                    prevBtn.onclick = () => changePage(page - 1);
                    paginationContainer.appendChild(prevBtn);

                    // 页码按钮
                    pageItems.forEach(item => {
                        if (item === '...') {
                            const ellipsis = document.createElement('span');
                            ellipsis.className = 'pagination-ellipsis';
                            ellipsis.innerText = '...';
                            paginationContainer.appendChild(ellipsis);
                        } else {
                            const pageBtn = document.createElement('button');
                            pageBtn.className = `pagination-btn ${item === page ? 'active' : ''}`;
                            pageBtn.innerText = item;
                            pageBtn.onclick = () => changePage(item);
                            paginationContainer.appendChild(pageBtn);
                        }
                    });

                    // 下一页按钮
                    const nextBtn = document.createElement('button');
                    nextBtn.className = 'pagination-btn';
                    nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
                    nextBtn.disabled = page === totalPages;
                    nextBtn.onclick = () => changePage(page + 1);
                    paginationContainer.appendChild(nextBtn);

                } catch (e) {
                    console.error("分页渲染错误:", e);
                    // 降级处理
                    paginationContainer.innerHTML = `
                        <button class="pagination-btn" onclick="window.changePageGlobal_${groupIndex}(${page-1})" ${page===1?'disabled':''}><i class="fas fa-chevron-left"></i></button>
                        <span class="text-xs text-gray-500">${page}/${totalPages}</span>
                        <button class="pagination-btn" onclick="window.changePageGlobal_${groupIndex}(${page+1})" ${page===totalPages?'disabled':''}><i class="fas fa-chevron-right"></i></button>
                    `;
                }
            };

            // 智能分页算法
            function generateSmartPagination(total, current, maxVisible) {
                if (total <= maxVisible) {
                    return Array.from({length: total}, (_, i) => i + 1);
                }

                const items = [1];
                let sideCount = Math.floor((maxVisible - 2) / 2);
                if (sideCount < 1) sideCount = 1;

                let leftBound = Math.max(2, current - sideCount);
                let rightBound = Math.min(total - 1, current + sideCount);

                if (current <= sideCount + 1) {
                    rightBound = Math.min(total - 1, 1 + (sideCount * 2));
                }
                if (current >= total - sideCount) {
                    leftBound = Math.max(2, total - (sideCount * 2));
                }

                if (leftBound > 2) items.push('...');
                
                for (let i = leftBound; i <= rightBound; i++) {
                    items.push(i);
                }

                if (rightBound < total - 1) items.push('...');
                
                items.push(total);
                return items;
            }

            const changePage = (newPage) => {
                if (newPage < 1 || newPage > totalPages) return;
                currentPage = newPage;
                renderPage(currentPage);
                const card = document.querySelector(`[data-group-index="${groupIndex}"]`);
                if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };

            window[`changePageGlobal_${groupIndex}`] = (p) => changePage(p);

            // 初始渲染
            renderPage(currentPage);

            // 监听窗口大小变化
            const handleResize = () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    // 传入isResize=true，仅重排页码，不重载音乐
                    renderPage(currentPage, true);
                }, 200);
            };
            window.addEventListener('resize', handleResize);
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
