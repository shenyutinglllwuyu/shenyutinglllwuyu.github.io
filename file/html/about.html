        body.standalone-mode .standalone-home-link:hover {

        }

        /* ========== 文字白边高光：两种模式下都生效（嵌套 iframe 与独立打开均可见） ========== */
        .section-title {
            color: #111827 !important;
            -webkit-text-stroke: 0.3px rgba(255,255,255,0.6);
            text-shadow:

    <script>
        const isInIframe = window.top !== window.self;
        if (!isInIframe) {
            document.body.classList.add('standalone-mode');
            const root = document.getElementById('page-root');
            const shell = document.createElement('div');
            shell.className = 'standalone-shell';
            root.parentNode.insertBefore(shell, root);
            shell.appendChild(root);
            document.title = '关于 - 带着企鹅去南极';
        }

        let lastNotifiedHeight = 0;
        let resizeTimer = null;
        const notifyParentResize = () => {
            if (!isInIframe) return;
            const height = Math.max(
                document.body.scrollHeight,
                document.body.offsetHeight,
                document.documentElement.offsetHeight
            );
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const now = Math.max(
                    document.body.scrollHeight,
                    document.body.offsetHeight,
                    document.documentElement.offsetHeight
                );
                if (Math.abs(now - lastNotifiedHeight) > 2) {
                    lastNotifiedHeight = now;
                    try { parent.postMessage({ type: 'iframe-resize', height: now }, '*'); } catch(e){}
                }
            }, 50);
        };

        window.addEventListener('message', (e) => {
            const data = e.data || {};
            if (data.type === 'request-resize') {
                lastNotifiedHeight = 0;
                notifyParentResize();
            }
        });

        document.getElementById('about-page-back-btn').addEventListener('click', (e) => {
            e.preventDefault();
            if (isInIframe) {
                try { parent.postMessage({ type: 'back-to-dynamic' }, '*'); } catch(err){}
            } else {
                location.href = 'index.html';
            }
        });

        document.querySelectorAll('img').forEach(img => {
            if (!img.complete) {
                img.addEventListener('load', notifyParentResize);
                img.addEventListener('error', notifyParentResize);
            }
        });

        window.addEventListener('load', () => {
            notifyParentResize();
            setTimeout(notifyParentResize, 300);
            setTimeout(notifyParentResize, 800);
        });
        window.addEventListener('resize', notifyParentResize);
    </script>
