<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态列表 - 带着企鹅去南极</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="web/favicon.ico" type="image/icon">
    <link rel="shortcut icon" href="web/favicon.ico" type="image/icon">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
    <style>
        /* ========== iframe 嵌入模式（默认）：透明无背景 ========== */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1f2937;
        }
        /* ========== 独立标签页（standalone）模式：与主页完全一致 ========== */
        body.standalone-mode {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 独立模式下背景由 JS 动态注入（fetch 一次 blob URL，避免重复随机） */
            background-color: #6b7280;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding: 20px;
            box-sizing: border-box;
        }
        body.standalone-mode .standalone-shell {
            width: 100%;
            max-width: 896px;
            background: rgba(255,255,255,0.15);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 2rem;
            box-sizing: border-box;
        }

        /* ========== 卡片基础样式（两种模式共用） ========== */
        .article-card {
            transition: none;
            cursor: pointer;
            background: rgba(255,255,255,0.15);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .article-card:hover {
            transform: none;
            background: rgba(255,255,255,0.15);
            box-shadow: none;
        }
        .line-ellipsis-1 {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .line-ellipsis-1-preview {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #374151;
            margin: 0;
            font-size: 0.95rem;
        }
        .plain-tag {
            box-shadow: none !important;
            text-shadow: none !important;
        }
        .expand-white-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, margin 0.4s ease, padding 0.4s ease;
            margin-top: 0;
            padding: 0 2rem;
        }
        .expand-white-card.show {
            margin-top: 1rem;
            padding: 2rem;
        }
        .md-rendered {
            color: #1f2937;
            line-height: 1.8;
            font-size: 16px;
            word-wrap: break-word;
            text-shadow: none !important;
        }
        .md-rendered h1, .md-rendered h2, .md-rendered h3, .md-rendered h4 {
            font-weight: 700;
            margin-top: 1.2em;
            margin-bottom: 0.6em;
            color: #111827;
        }
        .md-rendered h1 { font-size: 1.8em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3em; }
        .md-rendered h2 { font-size: 1.5em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3em; }
        .md-rendered h3 { font-size: 1.25em; }
        .md-rendered p { margin: 0.8em 0; }
        .md-rendered ul, .md-rendered ol { padding-left: 1.8em; margin: 0.6em 0; }
        .md-rendered li { margin: 0.3em 0; }
        .md-rendered a { color: #3b82f6; text-decoration: underline; }
        .md-rendered blockquote {
            border-left: 4px solid #3b82f6;
            padding: 0.2em 1em;
            margin: 1em 0;
            color: #4b5563;
            background: #f3f4f6;
            border-radius: 0 6px 6px 0;
        }
        .md-rendered code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            color: #dc2626;
        }
        .md-rendered pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 1em;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1em 0;
        }
        .md-rendered pre code {
            background: transparent;
            color: inherit;
            padding: 0;
            font-size: 0.9em;
        }
        .md-rendered img {
            max-width: 100%;
            border-radius: 8px;
            margin: 0.6em 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .md-rendered table {
            border-collapse: collapse;
            margin: 1em 0;
            width: 100%;
        }
        .md-rendered th, .md-rendered td {
            border: 1px solid #e5e7eb;
            padding: 0.5em 0.8em;
            text-align: left;
        }
        .md-rendered th { background: #f9fafb; font-weight: 600; }
        .md-rendered hr { border: none; border-top: 1px solid #e5e7eb; margin: 1.5em 0; }
        .md-rendered strong { font-weight: 700; color: #111827; }

        .pagination-btn {
            min-width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #1f2937;
            font-weight: bold;
            cursor: pointer;
            transition: none;
            margin: 0 4px;
        }
        .pagination-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            transform: none;
        }
        .pagination-btn.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: #3b82f6;
            color: #3b82f6;
            box-shadow: none;
        }
        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
            margin: 0;
            border-bottom: 0;
            padding-bottom: 0;
        }

        .standalone-home-link {
            display: none;
        }
        body.standalone-mode .standalone-home-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1.2rem;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 9999px;
            color: #1f2937;
            font-weight: 500;
            cursor: pointer;
            transition: none;
            text-decoration: none;
        }
        body.standalone-mode .standalone-home-link:hover {
            background: rgba(255,255,255,0.2);
            transform: none;
            color: #1f2937;
        }

        /* 顶部标题行布局，按钮与标题完全同高 */
        .top-title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.4);
            padding-bottom: 0.5rem;
        }

        /* 刷新按钮默认在所有模式下可见，保留原有按钮的全部样式 */
        #refresh-dynamic-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1.2rem;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 9999px;
            color: #1f2937;
            font-weight: 500;
            cursor: pointer;
            transition: none;
        }
        #refresh-dynamic-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: none;
            color: #1f2937;
        }

        /* ========== 文字白边高光：两种模式下都生效（嵌套 iframe 与独立打开均可见） ========== */
        /* 因为背景是半透明白卡片+模糊背景，无论独立还是嵌在主页里，深色字都需要白边描边才能在图上清晰可见 */
        .ts-strong,
        .section-title,
        .article-card h3 {
            color: #111827 !important;
            -webkit-text-stroke: 0.3px rgba(255,255,255,0.6);
            text-shadow:
                0 0 3px #ffffff,
                0 0 6px rgba(255,255,255,0.9),
                1px 1px 0 #ffffff,
                -1px 1px 0 #ffffff,
                1px -1px 0 #ffffff,
                -1px -1px 0 #ffffff,
                2px 2px 3px rgba(255,255,255,0.7),
                -2px 2px 3px rgba(255,255,255,0.7),
                2px -2px 3px rgba(255,255,255,0.7),
                -2px -2px 3px rgba(255,255,255,0.7);
        }
        .ts-soft,
        .line-ellipsis-1-preview,
        .article-card .meta-date,
        .pagination-btn,
        #pagination-container span,
        .empty-tip {
            color: #1f2937 !important;
            -webkit-text-stroke: 0.2px rgba(255,255,255,0.5);
            text-shadow:
                0 0 2px #ffffff,
                0 0 4px rgba(255,255,255,0.8),
                1px 1px 0 #ffffff,
                -1px 1px 0 #ffffff,
                1px -1px 0 #ffffff,
                -1px -1px 0 #ffffff,
                1px 1px 3px rgba(255,255,255,0.5);
        }
        /* 标签彩色徽章、按钮文字、展开内容、返回链接 不应该被高光污染（两种模式都不） */
        .plain-tag,
        .plain-tag *,
        .standalone-home-link,
        .standalone-home-link *,
        #refresh-dynamic-btn,
        #refresh-dynamic-btn *,
        .pagination-btn.active,
        .md-rendered,
        .md-rendered *,
        .expand-white-card,
        .expand-white-card *,
        .back-btn,
        .back-btn * {
            -webkit-text-stroke: 0 !important;
            text-shadow: none !important;
        }
        /* 错误/加载提示：两种模式都带高光 */
        .error-tip {
            color: #991b1b !important;
            -webkit-text-stroke: 0.2px rgba(255,255,255,0.5);
            text-shadow:
                0 0 2px #ffffff,
                1px 1px 0 #ffffff,
                -1px 1px 0 #ffffff,
                1px -1px 0 #ffffff,
                -1px -1px 0 #ffffff;
        }
        /* 独立标签页模式下额外加强（背景+毛玻璃） */
        body.standalone-mode .ts-strong,
        body.standalone-mode .section-title,
        body.standalone-mode .article-card h3 {
            text-shadow:
                0 0 4px #ffffff,
                0 0 8px rgba(255,255,255,1),
                1px 1px 0 #ffffff,
                -1px 1px 0 #ffffff,
                1px -1px 0 #ffffff,
                -1px -1px 0 #ffffff,
                2px 2px 4px rgba(255,255,255,0.85),
                -2px 2px 4px rgba(255,255,255,0.85),
                2px -2px 4px rgba(255,255,255,0.85),
                -2px -2px 4px rgba(255,255,255,0.85);
        }
        body.standalone-mode .ts-soft,
        body.standalone-mode .line-ellipsis-1-preview,
        body.standalone-mode .article-card .meta-date,
        body.standalone-mode .pagination-btn,
        body.standalone-mode #pagination-container span,
        body.standalone-mode .empty-tip {
            text-shadow:
                0 0 3px #ffffff,
                0 0 6px rgba(255,255,255,0.9),
                1px 1px 0 #ffffff,
                -1px 1px 0 #ffffff,
                1px -1px 0 #ffffff,
                -1px -1px 0 #ffffff,
                1px 1px 4px rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>
    <div id="page-root">
        <div class="top-title-bar">
            <a href="/index.html" class="standalone-home-link">
                <i class="fas fa-arrow-left"></i> 返回主页
            </a>
            <h2 class="section-title">动态列表</h2>
            <button id="refresh-dynamic-btn">
                <i class="fas fa-sync-alt"></i> 刷新动态
            </button>
        </div>

        <div id="card-list" class="space-y-6" style="min-height:200px;">
            <!-- 动态卡片将通过 JS 生成 -->
        </div>

        <div id="pagination-container" class="mt-8 flex justify-center items-center space-x-2">
            <!-- 分页按钮将通过 JS 生成 -->
        </div>
    </div>

    <script>
        // ========== 检测是否在 iframe 中；独立打开时启用 standalone 模式 ==========
        const isInIframe = window.top !== window.self;
        const BG_API = 'https://t.alcy.cc/ycy';

        if (!isInIframe) {
            document.body.classList.add('standalone-mode');
            const root = document.getElementById('page-root');
            const shell = document.createElement('div');
            shell.className = 'standalone-shell';
            root.parentNode.insertBefore(shell, root);
            shell.appendChild(root);
            // 独立模式：CSS 已直接用 url('https://t.alcy.cc/ycy') 铺底，无需再 fetch 覆盖，
            // 避免再次请求导致随机到另一张图
        }

        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false
        });

        const state = {
            allArticles: [],
            currentPage: 1,
            pageSize: 10,
            loadedContentCache: {}
        };

        const cardList = document.getElementById('card-list');
        const paginationContainer = document.getElementById('pagination-container');

        // 新增：刷新动态方法，点击后清空全部缓存重新拉取最新动态配置
        const forceRefreshDynamic = async () => {
            const refreshBtn = document.getElementById('refresh-dynamic-btn');
            const refreshIcon = refreshBtn.querySelector('i');
            // 启动旋转加载动画
            refreshIcon.classList.add('fa-spin');

            // 清空全部旧缓存与数据，重置到第一页
            state.allArticles = [];
            state.currentPage = 1;
            state.loadedContentCache = {};
            cardList.innerHTML = '<div class="empty-tip text-center py-10"><i class="fas fa-spinner fa-spin mr-2"></i> 正在重新加载最新动态...</div>';
            notifyParentResize();

            try {
                // 生成全新时间戳绕过浏览器全部缓存，强制获取最新配置
                const newTimestamp = new Date().getTime();
                const res = await fetch(`/file/json/articles-data.json?t=${newTimestamp}`, { cache: 'no-store' });
                if (!res.ok) throw new Error('刷新失败');
                state.allArticles = await res.json();
                renderPage(1);
            } catch (err) {
                console.error(err);
                cardList.innerHTML = `<div class="error-tip" style="background:rgba(255,255,255,0.2);border-radius:16px;padding:2rem;text-align:center;">动态列表配置刷新失败</div>`;
                notifyParentResize();
            } finally {
                // 加载完成后停止旋转动画
                refreshIcon.classList.remove('fa-spin');
            }
        };

        const detectFileType = (path, content) => {
            const lowerPath = (path || '').toLowerCase();
            if (lowerPath.endsWith('.html') || lowerPath.endsWith('.htm')) return 'html';
            if (lowerPath.endsWith('.md') || lowerPath.endsWith('.markdown')) return 'markdown';
            if (/^\s*<!doctype\s+html/i.test(content) || /<html[\s>]/i.test(content)) return 'html';
            if (/<(div|p|span|h[1-6]|a |img |ul|ol|table)[\s>]/i.test(content)) return 'html';
            return 'markdown';
        };

        const renderRichHTML = (rawText, fileType) => {
            if (fileType === 'html') {
                return window.DOMPurify ? DOMPurify.sanitize(rawText) : rawText;
            }
            let html = marked.parse(rawText);
            if (window.DOMPurify) {
                html = DOMPurify.sanitize(html, { ADD_TAGS: ['iframe'], ADD_ATTR: ['allow', 'allowfullscreen', 'frameborder', 'scrolling'] });
            }
            return html;
        };

        const extractPlainText = (html) => {
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            tmp.querySelectorAll('script,style,noscript').forEach(n => n.remove());
            let text = (tmp.innerText || tmp.textContent || '').replace(/\s+/g, ' ').trim();
            return text;
        };

        const highlightCodeBlocks = (container) => {
            if (window.hljs) {
                container.querySelectorAll('pre code').forEach((block) => {
                    try { hljs.highlightElement(block); } catch(e){}
                });
            }
        };

        const renderPage = (page) => {
            state.currentPage = page;
            cardList.innerHTML = '';

            const start = (page - 1) * state.pageSize;
            const end = start + state.pageSize;
            const pageArticles = state.allArticles.slice(start, end);

            if (pageArticles.length === 0) {
                cardList.innerHTML = '<div class="empty-tip text-center py-10">暂无更多文章</div>';
                notifyParentResize();
                return;
            }

            pageArticles.forEach((article, index) => {
                createCardDOM(article, start + index);
            });

            renderPaginationControls();
            notifyParentResize();
        };

        const createCardDOM = (article, globalIndex) => {
            const cardOuterDom = document.createElement('div');
            const cardId = `card-${globalIndex}`;

            cardOuterDom.innerHTML = `
                <div class="article-card" id="${cardId}-trigger">
                    <div style="display:flex;flex-direction:column;gap:0.5rem;min-height:0;">
                        <span class="plain-tag" style="display:inline-block;width:fit-content;padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:bold;color:#fff;background-color:#${article.tagColor};align-self:flex-start;">
                            ${article.tagText}
                        </span>
                        <h3 style="font-size:1.25rem;font-weight:700;color:#1f2937;margin:0;" class="line-ellipsis-1">
                            ${article.title}
                        </h3>
                        <p class="line-ellipsis-1-preview ts-soft" id="${cardId}-preview">
                            <i class="fas fa-spinner fa-spin"></i> 正在加载摘要...
                        </p>
                        <p class="meta-date" style="margin:0;color:#4b5563;font-size:0.85rem;text-align:right;font-family:Consolas,Monaco,monospace;">
                            <i class="far fa-calendar-alt"></i> ${article.updateTime}
                        </p>
                    </div>
                </div>
                <div class="expand-white-card md-content-container" id="${cardId}-content">
                    <div style="text-align:center;color:#6b7280;"><i class="fas fa-spinner fa-spin"></i> 内容加载中...</div>
                </div>
            `;

            const previewTextEl = cardOuterDom.querySelector(`#${cardId}-preview`);
            const expandWhiteCard = cardOuterDom.querySelector(`#${cardId}-content`);
            let isExpanded = false;

            previewTextEl.dataset.path = article.mdPath;
            loadArticleContent(article.mdPath, previewTextEl, expandWhiteCard);

            cardOuterDom.querySelector(`#${cardId}-trigger`).addEventListener('click', () => {
                if (!isExpanded) {
                    expandWhiteCard.classList.add('show');
                    expandWhiteCard.style.maxHeight = 'none';
                    const targetHeight = expandWhiteCard.scrollHeight;
                    expandWhiteCard.style.maxHeight = '0px';
                    requestAnimationFrame(() => {
                        expandWhiteCard.style.maxHeight = targetHeight + 'px';
                        notifyParentResize();
                    });
                    const onEnd = () => {
                        expandWhiteCard.removeEventListener('transitionend', onEnd);
                        expandWhiteCard.style.maxHeight = 'none';
                        notifyParentResize();
                    };
                    expandWhiteCard.addEventListener('transitionend', onEnd);
                    isExpanded = true;
                } else {
                    const currentHeight = expandWhiteCard.scrollHeight;
                    expandWhiteCard.style.maxHeight = currentHeight + 'px';
                    // eslint-disable-next-line no-unused-expressions
                    expandWhiteCard.offsetHeight;
                    requestAnimationFrame(() => {
                        expandWhiteCard.style.maxHeight = '0px';
                        expandWhiteCard.classList.remove('show');
                        notifyParentResize();
                    });
                    isExpanded = false;
                }
                setTimeout(notifyParentResize, 100);
                setTimeout(notifyParentResize, 450);
            });

            cardList.appendChild(cardOuterDom);
        };

        const loadArticleContent = async (path, previewEl, contentEl) => {
            if (state.loadedContentCache[path]) {
                updateCardWithContent(state.loadedContentCache[path], previewEl, contentEl);
                return;
            }
            try {
                const res = await fetch(path);
                if (res.ok) {
                    const rawText = await res.text();
                    state.loadedContentCache[path] = rawText;
                    updateCardWithContent(rawText, previewEl, contentEl);
                } else {
                    previewEl.innerHTML = '<span class="error-tip">文章文件不存在</span>';
                    contentEl.innerHTML = `<div style="text-align:center;color:#6b7280;">该文章文件不存在</div>`;
                    notifyParentResize();
                }
            } catch (e) {
                previewEl.innerHTML = '<span class="error-tip">内容加载失败</span>';
                contentEl.innerHTML = `<div style="text-align:center;color:#6b7280;">内容加载失败，请检查文件路径</div>`;
                notifyParentResize();
            }
        };

        const updateCardWithContent = (rawText, previewEl, contentEl) => {
            const filePath = previewEl.dataset && previewEl.dataset.path;
            const fileType = detectFileType(filePath, rawText);
            const richHTML = renderRichHTML(rawText, fileType);

            const plainText = extractPlainText(richHTML);
            previewEl.textContent = plainText.length > 80 ? plainText.slice(0, 80) + '...' : (plainText || '（无内容预览）');

            contentEl.innerHTML = `<div class="md-rendered">${richHTML}</div>`;
            highlightCodeBlocks(contentEl);
            observeMediaLoad(contentEl);
            notifyParentResize();
        };

        const renderPaginationControls = () => {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(state.allArticles.length / state.pageSize);
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = 'pagination-btn';
            prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
            prevBtn.disabled = state.currentPage === 1;
            prevBtn.onclick = () => { renderPage(state.currentPage - 1); window.scrollTo({top:0,behavior:'smooth'}); };
            paginationContainer.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= state.currentPage - 1 && i <= state.currentPage + 1)) {
                    const btn = document.createElement('button');
                    btn.className = `pagination-btn ${i === state.currentPage ? 'active' : ''}`;
                    btn.textContent = i;
                    btn.onclick = () => { renderPage(i); window.scrollTo({top:0,behavior:'smooth'}); };
                    paginationContainer.appendChild(btn);
                } else if (i === state.currentPage - 2 || i === state.currentPage + 2) {
                    const span = document.createElement('span');
                    span.style.color = '#9ca3af';
                    span.style.margin = '0 8px';
                    span.textContent = '...';
                    paginationContainer.appendChild(span);
                }
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'pagination-btn';
            nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
            nextBtn.disabled = state.currentPage === totalPages;
            nextBtn.onclick = () => { renderPage(state.currentPage + 1); window.scrollTo({top:0,behavior:'smooth'}); };
            paginationContainer.appendChild(nextBtn);
        };

        // 通知父窗口调整 iframe 高度
        let lastNotifiedHeight = 0;
        let resizeTimer = null;
        const notifyParentResize = () => {
            if (!isInIframe) return;
            const height = Math.max(
                document.body.scrollHeight,
                document.body.offsetHeight,
                document.documentElement.offsetHeight
            );
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const now = Math.max(
                    document.body.scrollHeight,
                    document.body.offsetHeight,
                    document.documentElement.offsetHeight
                );
                if (Math.abs(now - lastNotifiedHeight) > 2) {
                    lastNotifiedHeight = now;
                    try {
                        parent.postMessage({ type: 'iframe-resize', height: now }, '*');
                    } catch(e){}
                }
            }, 50);
        };

        window.addEventListener('message', (e) => {
            const data = e.data || {};
            if (data.type === 'request-resize') {
                lastNotifiedHeight = 0;
                notifyParentResize();
            }
        });

        const observeMediaLoad = (root) => {
            const imgs = root.querySelectorAll('img');
            imgs.forEach(img => {
                if (img.complete) return;
                img.addEventListener('load', notifyParentResize);
                img.addEventListener('error', notifyParentResize);
            });
            const subIframes = root.querySelectorAll('iframe');
            subIframes.forEach(f => {
                f.addEventListener('load', notifyParentResize);
            });
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            // 绑定刷新动态按钮点击事件
            document.getElementById('refresh-dynamic-btn').addEventListener('click', forceRefreshDynamic);

            try {
                const timestamp = new Date().getTime();
                const res = await fetch(`/file/json/articles-data.json?t=${timestamp}`, { cache: 'no-store' });
                if (!res.ok) throw new Error('Config load failed');
                state.allArticles = await res.json();
                renderPage(1);
            } catch (err) {
                console.error(err);
                cardList.innerHTML = `<div class="error-tip" style="background:rgba(255,255,255,0.2);border-radius:16px;padding:2rem;text-align:center;">文章列表配置加载失败</div>`;
                notifyParentResize();
            }
        });

        window.addEventListener('load', notifyParentResize);
        window.addEventListener('resize', notifyParentResize);
        window.addEventListener('load', () => {
            setTimeout(notifyParentResize, 500);
        });
    </script>
</body>
</html>
