
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 自定义动画与样式 */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .album-art {
            transition: transform 0.5s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .album-art.playing {
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 进度条样式 */
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -6px; 
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        }

        .control-btn {
            transition: all 0.2s;
        }
        .control-btn:hover {
            transform: scale(1.1);
            color: #fff;
        }
        .control-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="h-screen w-full flex items-center justify-center overflow-hidden text-white">

    <!-- 播放器主体容器 -->
    <div class="glass-panel rounded-3xl p-8 w-full max-w-md mx-4 relative">
        
        <!-- 顶部标题栏 -->
        <div class="flex justify-between items-center mb-6">
            <button id="prevBtn" class="text-gray-300 hover:text-white transition"><i class="fas fa-chevron-down"></i></button>
            <span class="text-sm font-medium tracking-widest uppercase opacity-80"><a href="/index.html">首页</a></span>
            <button id="nextBtn" class="text-gray-300 hover:text-white transition"><i class="fas fa-chevron-up"></i></button>
        </div>

        <!-- 专辑封面区域 -->
        <div class="flex justify-center mb-8">
            <div id="albumArtContainer" class="w-48 h-48 rounded-full overflow-hidden border-4 border-white/20 album-art relative">
                <!-- 默认占位图，实际使用时可替换 -->
                <img id="coverImage" src="https://picsum.photos/300/300?random=1" alt="Music Album Cover" class="w-full h-full object-cover">
                <!-- 中心圆点装饰 -->
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-white/20 rounded-full backdrop-blur-sm border border-white/30"></div>
            </div>
        </div>

        <!-- 歌曲信息 -->
        <div class="text-center mb-6">
            <h2 id="songTitle" class="text-2xl font-bold mb-1 truncate px-4">NowLoading...</h2>
            <p id="artistName" class="text-sm text-gray-300 opacity-80">Unknown Artist</p>
        </div>

        <!-- 进度条 -->
        <div class="mb-6 px-2">
            <div class="flex justify-between text-xs text-gray-300 mb-2 font-mono">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <input type="range" id="progressBar" value="0" min="0" max="100" class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
        </div>

        <!-- 控制按钮 -->
        <div class="flex justify-between items-center px-4 mb-8">
            <button id="shuffleBtn" class="control-btn text-gray-400 text-lg" title="随机播放"><i class="fas fa-random"></i></button>
            
            <div class="flex items-center space-x-6">
                <button id="prevTrackBtn" class="control-btn text-2xl"><i class="fas fa-step-backward"></i></button>
                
                <button id="playPauseBtn" class="control-btn w-16 h-16 bg-white text-purple-600 rounded-full flex items-center justify-center shadow-lg hover:bg-gray-100">
                    <i class="fas fa-play text-2xl ml-1" id="playIcon"></i>
                </button>
                
                <button id="nextTrackBtn" class="control-btn text-2xl"><i class="fas fa-step-forward"></i></button>
            </div>

            <button id="loopBtn" class="control-btn text-gray-400 text-lg" title="循环模式"><i class="fas fa-redo"></i></button>
        </div>

        <!-- 音量控制 -->
        <div class="flex items-center justify-center space-x-3 px-4">
            <i class="fas fa-volume-down text-gray-400 text-sm"></i>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" class="w-24 h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
            <i class="fas fa-volume-up text-gray-400 text-sm"></i>
        </div>

        <!-- 隐藏的文件上传用于本地测试（可选功能，主要依靠配置路径） -->
        <!-- <input type="file" id="fileInput" accept="audio/*" class="hidden"> -->
    </div>

    <!-- 核心音频元素 -->
    <!-- 
      【重要配置说明】
      若要修改默认播放的音乐，请修改下方 JavaScript 代码中 playlist 数组里的 src 路径。
      路径可以是相对路径（如 './music/song.mp3'）或绝对URL。
    -->
    <audio id="audioPlayer" preload="metadata"></audio>

    <script>
        // ==========================================
        // 配置区域：在此处修改你的 MP3 文件路径
        // ==========================================
        const playlist = [
            {
                title: "跑操音乐3.0",
                artist: "小沈同学",
                // 修改这里的 src 指向网站根目录中的 mp3 文件
                // 例如: src: "./assets/music/my-song.mp3"
                src: "./跑操音乐3.0_.mp3", 
                cover: "./CH0242_spr_17.png"
            },
            {
                title: "海兰德学院跑操曲",
                artist: "芝士Cabob",
                src: "./海兰德学院跑操曲.mp3",
                cover: "./x76w7ph8.png"
            }
        ];

        // ==========================================
        // 逻辑实现
        // ==========================================
        
        // DOM 元素获取
        const audio = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const prevTrackBtn = document.getElementById('prevTrackBtn');
        const nextTrackBtn = document.getElementById('nextTrackBtn');
        const progressBar = document.getElementById('progressBar');
        const volumeSlider = document.getElementById('volumeSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const songTitleEl = document.getElementById('songTitle');
        const artistNameEl = document.getElementById('artistName');
        const coverImageEl = document.getElementById('coverImage');
        const albumArtContainer = document.getElementById('albumArtContainer');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const loopBtn = document.getElementById('loopBtn');

        // 状态变量
        let currentTrackIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let loopMode = 0; // 0: 不循环, 1: 列表循环, 2: 单曲循环

        // 初始化播放器
        function initPlayer() {
            loadTrack(currentTrackIndex);
            audio.volume = volumeSlider.value;
        }

        // 加载歌曲
        function loadTrack(index) {
            const track = playlist[index];
            audio.src = track.src;
            songTitleEl.textContent = track.title;
            artistNameEl.textContent = track.artist;
            coverImageEl.src = track.cover;
            coverImageEl.alt = `${track.title} Album Cover`;
            
            // 重置进度条
            progressBar.value = 0;
            currentTimeEl.textContent = "0:00";
            durationEl.textContent = "0:00";
            
            // 如果正在播放，加载新曲目后继续播放
            if (isPlaying) {
                audio.play().catch(e => console.error("播放失败:", e));
            }
        }

        // 播放/暂停切换
        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    isPlaying = true;
                    playIcon.classList.remove('fa-play');
                    playIcon.classList.add('fa-pause');
                    albumArtContainer.classList.add('playing');
                }).catch(e => {
                    console.error("播放被阻止或出错:", e);
                    alert("无法播放音频，请检查文件路径或浏览器策略。");
                });
            } else {
                audio.pause();
                isPlaying = false;
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                albumArtContainer.classList.remove('playing');
            }
        }

        // 下一首
        function nextTrack() {
            if (isShuffle) {
                currentTrackIndex = Math.floor(Math.random() * playlist.length);
            } else {
                currentTrackIndex++;
                if (currentTrackIndex >= playlist.length) {
                    currentTrackIndex = 0;
                }
            }
            loadTrack(currentTrackIndex);
            if (!isPlaying) togglePlay(); // 如果是暂停状态切歌，自动开始播放
        }

        // 上一首
        function prevTrack() {
            currentTrackIndex--;
            if (currentTrackIndex < 0) {
                currentTrackIndex = playlist.length - 1;
            }
            loadTrack(currentTrackIndex);
            if (!isPlaying) togglePlay();
        }

        // 格式化时间
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // 更新进度条
        function updateProgress() {
            const { duration, currentTime } = audio;
            if (isNaN(duration)) return;
            
            const progressPercent = (currentTime / duration) * 100;
            progressBar.value = progressPercent;
            
            currentTimeEl.textContent = formatTime(currentTime);
            durationEl.textContent = formatTime(duration);
            
            // 动态更新进度条背景色以显示进度
            const val = progressBar.value;
            progressBar.style.background = `linear-gradient(to right, #ffffff ${val}%, rgba(255,255,255,0.3) ${val}%)`;
        }

        // 拖动进度条
        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX; // 对于input range，直接使用value更准确
            const duration = audio.duration;
            audio.currentTime = (progressBar.value / 100) * duration;
        }

        // 歌曲结束处理
        function handleTrackEnd() {
            if (loopMode === 2) {
                // 单曲循环
                audio.currentTime = 0;
                audio.play();
            } else if (loopMode === 1 || currentTrackIndex < playlist.length - 1 || isShuffle) {
                // 列表循环 或 还有下一首 或 随机模式
                nextTrack();
            } else {
                // 播放结束，停止
                isPlaying = false;
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                albumArtContainer.classList.remove('playing');
            }
        }

        // 事件监听
        playPauseBtn.addEventListener('click', togglePlay);
        nextTrackBtn.addEventListener('click', nextTrack);
        prevTrackBtn.addEventListener('click', prevTrack);
        
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });
        audio.addEventListener('ended', handleTrackEnd);
        
        progressBar.addEventListener('input', function() {
            const duration = audio.duration;
            audio.currentTime = (this.value / 100) * duration;
            // 实时更新背景渐变
            const val = this.value;
            this.style.background = `linear-gradient(to right, #ffffff ${val}%, rgba(255,255,255,0.3) ${val}%)`;
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // 随机播放切换
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('text-white');
            shuffleBtn.classList.toggle('text-gray-400');
        });

        // 循环模式切换
        loopBtn.addEventListener('click', () => {
            loopMode = (loopMode + 1) % 3;
            updateLoopIcon();
        });

        function updateLoopIcon() {
            loopBtn.classList.remove('text-gray-400', 'text-white');
            loopBtn.innerHTML = '';
            
            if (loopMode === 0) {
                loopBtn.classList.add('text-gray-400');
                loopBtn.innerHTML = '<i class="fas fa-redo"></i>'; // 无循环
            } else if (loopMode === 1) {
                loopBtn.classList.add('text-white');
                loopBtn.innerHTML = '<i class="fas fa-redo"></i>'; // 列表循环
            } else {
                loopBtn.classList.add('text-white');
                loopBtn.innerHTML = '<i class="fas fa-redo-alt"></i><span class="text-[8px] absolute -top-1 -right-1">1</span>'; // 单曲循环 (简化示意)
                // 为了简单起见，这里用 redo-alt 代表单曲，实际项目中可用更复杂的图标逻辑
            }
        }

        // 键盘快捷键支持
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // 防止页面滚动
                togglePlay();
            } else if (e.code === 'ArrowRight') {
                audio.currentTime += 5;
            } else if (e.code === 'ArrowLeft') {
                audio.currentTime -= 5;
            }
        });
    
        // 启动
        initPlayer();
    </script>
</body>
</html>
